<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="1PbrP9iXsJHlc4xQHSorhLfc94fdmwZwQp5-bN4jGSM" />

    <!--
      Icons first, before the SEO block.

      The mark is the script "F" alone, not the full F2H lockup. The lockup is
      2.1:1, so in a square icon it gets about 15px of height at 32px and
      renders as a smudge; a single glyph fills the square and stays readable.

      The 48px entry is not decoration. Google's own requirement for the favicon
      it shows beside a search result is a square whose size is a multiple of
      48 — a site can have a perfectly good 32px tab icon and still get a blank
      globe in the results, which is exactly what was here.

      `favicon.ico` is listed last but matters most for the case nobody
      controls: browsers, crawlers and feed readers request `/favicon.ico` at
      the root whether or not the HTML mentions it. Without the file that is a
      404 on every page load.
    -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#4a7c1f" />
    <meta name="apple-mobile-web-app-title" content="F2H Market" />

    <!--
      Everything below the icons is what a search engine reads.

      There was no <title> beyond a bare name and no description at all, which
      is why the site showed up in Google with nothing under it: with no
      description, Google either invents one from whatever text it can find or
      prints the URL. This page is the only HTML a crawler is served — the app
      is client-rendered, so the router's per-page titles are set by JS after
      load (see src/utils/seo.js). These tags are the floor every route starts
      from and what a link preview uses.
    -->

    <title>F2H Market — Farm to Home | Fresh Groceries Delivered from Local Farmers</title>
    <meta
      name="description"
      content="F2H Market delivers farm-fresh vegetables and groceries straight from local farmers to your home. Build a weekly basket, pay cash on delivery, no middlemen. Order fresh produce online today."
    />

    <!--
      Google has ignored the keywords meta since 2009, so this is not what makes
      the site rank — the title, description and page copy are. It is kept
      because some smaller Indian search engines and site-search tools still
      read it, and it costs nothing.
    -->
    <meta
      name="keywords"
      content="f2h market, f2h home, f2h, farm to home, farmtohome, farm2home, groceries to home, grocery delivery, fresh vegetables online, farm fresh vegetables, buy vegetables online, local farmers market, weekly vegetable basket, cash on delivery groceries, organic vegetables delivery, direct from farmer"
    />

    <link rel="canonical" href="https://f2hmarket.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="F2H Market" />

    <!-- Link previews: WhatsApp, Facebook, LinkedIn, Slack. WhatsApp matters
         most here — it is how a marketplace like this actually gets shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="F2H Market" />
    <meta property="og:title" content="F2H Market — Farm to Home | Fresh Groceries Delivered" />
    <meta
      property="og:description"
      content="Farm-fresh vegetables and groceries delivered from local farmers to your door. Build a weekly basket, pay cash on delivery, no middlemen."
    />
    <meta property="og:url" content="https://f2hmarket.com/" />
    <meta property="og:locale" content="en_IN" />
    <!-- Absolute, because a crawler has no page to resolve a relative path
         against. 1200x630 is what the scrapers crop to. -->
    <meta property="og:image" content="https://f2hmarket.com/f2h-logo-brand.png" />
    <meta property="og:image:alt" content="F2H Market — Farm to Home" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="F2H Market — Farm to Home | Fresh Groceries Delivered" />
    <meta
      name="twitter:description"
      content="Farm-fresh vegetables and groceries delivered from local farmers to your door. Cash on delivery, no middlemen."
    />
    <meta name="twitter:image" content="https://f2hmarket.com/f2h-logo-brand.png" />


    <!--
      Structured data. This is what can earn the sitelinks search box and the
      brand panel for "f2h market" — the two things a new brand most wants, and
      neither is available from meta tags alone.

      Claims only what the code actually does: it sells groceries, in India, in
      rupees, cash on delivery. Nothing here asserts an address or opening hours,
      because inventing those is how a business gets its structured data ignored.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://f2hmarket.com/#organization",
            "name": "F2H Market",
            "alternateName": ["F2H", "Farm to Home", "F2H Home"],
            "url": "https://f2hmarket.com/",
            "logo": "https://f2hmarket.com/f2h-logo-brand.png",
            "description": "F2H Market connects local farmers directly with households, delivering farm-fresh vegetables and groceries with no middlemen.",
            "areaServed": { "@type": "Country", "name": "India" }
          },
          {
            "@type": "WebSite",
            "@id": "https://f2hmarket.com/#website",
            "url": "https://f2hmarket.com/",
            "name": "F2H Market",
            "publisher": { "@id": "https://f2hmarket.com/#organization" },
            "inLanguage": "en-IN",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://f2hmarket.com/products?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "OnlineStore",
            "@id": "https://f2hmarket.com/#store",
            "name": "F2H Market",
            "url": "https://f2hmarket.com/",
            "image": "https://f2hmarket.com/f2h-logo-brand.png",
            "description": "Buy farm-fresh vegetables and groceries online from local farmers. Weekly baskets and cash on delivery across India.",
            "currenciesAccepted": "INR",
            "paymentAccepted": "Cash on Delivery",
            "parentOrganization": { "@id": "https://f2hmarket.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
